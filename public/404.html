<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지 이동 중...</title>
    <script>
      // Single Page Application deep link handler for static 404s
      var path = window.location.pathname.toLowerCase();
      var search = window.location.search;
      var hash = window.location.hash;

      if (path === '/admin' || path.indexOf('/admin') !== -1) {
        window.location.replace('/?page=admin' + (hash ? hash : ''));
      } else {
        window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
      }
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #080D1A;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0, 82, 255, 0.2);
        border-top-color: #0052FF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; font-weight: 600;">페이지로 안전하게 연결 중입니다...</p>
    </div>
  </body>
</html>
