<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 페이지로 이동 중...</title>
    <script>
      // Automatically redirect to the SPA root with admin query / hash parameter
      var target = '/?page=admin' + (window.location.hash || '');
      window.location.replace(target);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #080D1A;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0, 82, 255, 0.2);
        border-top-color: #0052FF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; font-weight: 600;">관리자 페이지로 연결하고 있습니다...</p>
    </div>
  </body>
</html>
